canvas.addEventListener('wheel', e => {
  e.preventDefault();
  camera.dist = clamp(camera.dist * Math.exp(e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0012)), camera.minDist, camera.maxDist);
  hideHint();
}, { passive: false });
canvas.addEventListener('dblclick', e => {
  const ray = screenRay(e.clientX, e.clientY);
  if (!pickObject(ray) && !pickButter(ray)) resetCamera();
});

let hoverDirty = false;
function updateCursor() {
  let c = 'default';
  if (pointer.down) c = pointer.mode === 'finger' ? 'none' : 'grabbing';
  else {
    const ray = screenRay(pointer.sx, pointer.sy);
    if (pickObject(ray) || pickButter(ray)) c = grabModeUI === 'press' ? 'pointer' : 'grab';
  }
  if (canvas.style.cursor !== c) canvas.style.cursor = c;
}

// ---- keyboard ----
window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'r') resetAll();
  else if (k === 'g') setGravity(!params.gravityOn);
  else if (k === 'f') toggleFullscreen();
  else if (k === 'h') setPanelCollapsed(!panel.classList.contains('collapsed'));
  else if (k === 'c') resetCamera();
  else if (k >= '1' && k <= '5') dropObject(SPAWN_KEYS[+k - 1]);
  else return;
  hideHint();
});

// ---- main loop: fixed timestep + render interpolation ----
// Runs `steps` fixed steps, moving the drag target smoothly from where the
// simulation last saw it to the latest pointer position.
function advance(steps) {
  const x0 = pointer.simX, y0 = pointer.simY, z0 = pointer.simZ;
  for (let k = 0; k < steps; k++) {
    pointer.stepX0 = pointer.simX; pointer.stepY0 = pointer.simY; pointer.stepZ0 = pointer.simZ;
    const f = (k + 1) / steps;
    pointer.stepX1 = lerp(x0, pointer.x, f); pointer.stepY1 = lerp(y0, pointer.y, f); pointer.stepZ1 = lerp(z0, pointer.z, f);
    step(STEP_DT);
    pointer.simX = pointer.stepX1; pointer.simY = pointer.stepY1; pointer.simZ = pointer.stepZ1;
  }
}

let lastTime = performance.now(), accumulator = 0, fpsFrames = 0, fpsTime = 0, paused = false;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (!(dt > 0)) dt = 0;
  const realDt = dt;
  if (dt > 0.1) dt = 0.1;
  if (paused) dt = 0;
  accumulator += dt;
  let steps = Math.floor(accumulator / STEP_DT);
  if (steps > MAX_STEPS_PER_FRAME) { steps = MAX_STEPS_PER_FRAME; accumulator = 0; }
  else accumulator -= steps * STEP_DT;
  if (steps > 0) advance(steps);
  updateShake(dt);
  if (!gl.isContextLost()) render(clamp(accumulator / STEP_DT, 0, 1), realDt);
  if (hoverDirty && !pointer.down) { hoverDirty = false; updateCursor(); }
  fpsFrames++; fpsTime += realDt;
  if (fpsTime >= 0.5) { fpsEl.textContent = Math.round(fpsFrames / fpsTime) + ' FPS'; fpsFrames = 0; fpsTime = 0; }
}

// ---- boot ----
if (!gl) {
  $('nogl').hidden = false;
  return;
}
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); R6 = null; });
canvas.addEventListener('webglcontextrestored', () => { initGL(); });
buildButterMesh();
resize();
deriveParams();
resetButter();
initGL();
updateCamera();
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { lastTime = performance.now(); });
requestAnimationFrame(t => { lastTime = t; frame(t); });

// small debugging / testing handle (deterministic stepping + scripted pointer)
window.butterToy3d = {
  params, butter, bodies, tune, camera, ARENA,
  pause(p = true) { paused = p; },
  run(steps = 1) { advance(steps); render(1); },
  sim(steps = 1) { advance(steps); },
  pressWorld(x, y, z, mode = 'pinch') {
    pointer.down = true; pointer.id = -1;
    if (mode === 'object') { const ray = { ox: x, oy: y + 500, oz: z, dx: 0, dy: -1, dz: 0 }; const o = pickObject(ray); if (o) beginObjectGrab(o.body, x, y, z); }
    else if (mode === 'finger') beginFinger(x, y, z);
    else beginButterGrab(x, y, z, mode === 'whole');
    return pointer.mode;
  },
  pressScreen(sx, sy, opts = {}) { pointer.down = true; pointer.id = -1; beginInteraction(sx, sy, opts); return pointer.mode; },
  moveWorld(x, y, z) { pointer.x = x; pointer.y = y; pointer.z = z; pushHistory(x, y, z); },
  release(vx = 0, vy = 0, vz = 0) {
    const t = performance.now();
    pointer.hist.length = 0;
    pointer.hist.push({ t: t - 50, x: pointer.x - vx * 0.05, y: pointer.y - vy * 0.05, z: pointer.z - vz * 0.05 }, { t, x: pointer.x, y: pointer.y, z: pointer.z });
    if (pointer.mode && pointer.mode !== 'orbit') endInteraction(); else pointer.mode = null;
    pointer.down = false; pointer.id = null;
  },
  spawn: spawnObject, drop: dropObject, reset: resetAll,
  get shake() { return shake; },
  arrays: () => ({ BX, BY, BZ, BVX, BVY, BVZ, stick: butter.stick }),
  stats,
  flipped: () => countFlipped(),
  state() {
    butterBounds();
    let V = 0;
    const T = butter.tris;
    for (let t = 0; t < butter.nt; t++) {
      const a = T[3 * t], b = T[3 * t + 1], c = T[3 * t + 2];
      V += BX[a] * (BY[b] * BZ[c] - BZ[b] * BY[c]) + BY[a] * (BZ[b] * BX[c] - BX[b] * BZ[c]) + BZ[a] * (BX[b] * BY[c] - BY[b] * BX[c]);
    }
    return { n: butter.n, nt: butter.nt, ne: butter.ne, cx: butter.cx, cy: butter.cy, cz: butter.cz, q: butter.q.slice(),
      squash: butter.squash, volRatio: V / 6 / butter.vol0, minX: bb.minX, maxX: bb.maxX, minY: bb.minY, maxY: bb.maxY, minZ: bb.minZ, maxZ: bb.maxZ,
      boost: butter.smBoost, rescue: butter.rescue,
      objects: bodies.filter(b => b.kind !== 'finger').map(b => ({ kind: b.kind, x: b.x, y: b.y, z: b.z, vx: b.vx, vy: b.vy, vz: b.vz })) };
  },
};
})();
</script>
</body>
</html>
