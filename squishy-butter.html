  return { x: lerp(b.sx, b.x, alpha), y: lerp(b.sy, b.y, alpha), a: lerp(b.sa, b.a, alpha) };
}

function drawObjectShadow(b, alpha) {
  const p = bodyPose(b, alpha);
  const bottom = p.y + (b.kind === 'hammer' ? 20 : b.radius);
  drawFloorShadow(p.x, b.radius * (b.kind === 'hammer' ? 0.85 : 0.9), world.floorY - bottom, b.kind === 'metal' ? 0.32 : 0.24);
}

function shadeSphere(r, light, mid, dark) {
  const g = ctx.createRadialGradient(-r * 0.35, -r * 0.42, r * 0.08, 0, 0, r * 1.05);
  g.addColorStop(0, light); g.addColorStop(0.55, mid); g.addColorStop(1, dark);
  return g;
}

function drawObject(b, alpha) {
  const { x, y, a } = bodyPose(b, alpha);
  ctx.save();
  ctx.translate(x, y);
  switch (b.kind) {
    case 'small': {
      const r = b.parts[0].r;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
      ctx.fillStyle = shadeSphere(r, '#b6d1f6', '#729ee2', '#4a70b2'); ctx.fill();
      ctx.save(); ctx.clip(); ctx.rotate(a);
      ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = 1.7;
      ctx.beginPath(); ctx.arc(-r * 1.15, 0, r * 0.82, -0.95, 0.95); ctx.stroke();
      ctx.beginPath(); ctx.arc(r * 1.15, 0, r * 0.82, Math.PI - 0.95, Math.PI + 0.95); ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = 'rgba(35,55,95,0.5)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.ellipse(-r * 0.38, -r * 0.46, r * 0.28, r * 0.16, -0.6, 0, TAU); ctx.fill();
      break;
    }
    case 'rubber': {
      const r = b.parts[0].r;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
      ctx.fillStyle = '#e2564e'; ctx.fill();
      ctx.save(); ctx.clip(); ctx.rotate(a);
      ctx.fillStyle = '#f4e4c4'; ctx.fillRect(-r, -r * 0.24, 2 * r, r * 0.48);
      ctx.restore();
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
      const g = ctx.createRadialGradient(-r * 0.35, -r * 0.42, r * 0.1, 0, 0, r * 1.05);
      g.addColorStop(0, 'rgba(255,240,230,0.35)'); g.addColorStop(0.5, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(90,10,10,0.32)');
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = 'rgba(110,25,20,0.55)'; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.ellipse(-r * 0.38, -r * 0.46, r * 0.26, r * 0.15, -0.6, 0, TAU); ctx.fill();
      break;
    }
    case 'metal': {
      const r = b.parts[0].r;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
      const g = ctx.createRadialGradient(-r * 0.35, -r * 0.42, r * 0.05, 0, 0, r * 1.05);
      g.addColorStop(0, '#fbfcfd'); g.addColorStop(0.3, '#c9ced5'); g.addColorStop(0.72, '#7f8791'); g.addColorStop(1, '#4b525c');
      ctx.fillStyle = g; ctx.fill();
      ctx.save(); ctx.clip();
      ctx.fillStyle = 'rgba(222,196,150,0.22)';            // warm floor reflection
      ctx.beginPath(); ctx.ellipse(0, r * 0.82, r * 0.95, r * 0.42, 0, 0, TAU); ctx.fill();
      ctx.rotate(a);                                        // faint machining line shows the spin
      ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, 0, r * 0.62, -0.5, 0.9); ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = 'rgba(40,45,52,0.6)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.ellipse(-r * 0.36, -r * 0.44, r * 0.18, r * 0.11, -0.6, 0, TAU); ctx.fill();
      break;
    }
    case 'cube': {
      ctx.rotate(a);
      const s = 23;
      ctx.beginPath(); rrect(-s, -s, 2 * s, 2 * s, 6);
      const g = ctx.createLinearGradient(-s, -s, s, s);
      g.addColorStop(0, '#f2a789'); g.addColorStop(1, '#d76f4e');
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = 'rgba(115,48,28,0.6)'; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.beginPath(); rrect(-s + 6.5, -s + 6.5, 2 * s - 13, 2 * s - 13, 4);
      ctx.strokeStyle = 'rgba(255,240,230,0.45)'; ctx.lineWidth = 1.8; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.beginPath(); rrect(-s + 3, -s + 3, 2 * s - 6, 5, 2.5); ctx.fill();
      break;
    }
    case 'hammer': {
      ctx.rotate(a);
      ctx.translate(-b.comX, -b.comY);
      // handle
      ctx.beginPath(); rrect(-72, -6.5, 124, 13, 6);
      const hg = ctx.createLinearGradient(0, -6.5, 0, 6.5);
      hg.addColorStop(0, '#ddab74'); hg.addColorStop(1, '#a66d3c');
      ctx.fillStyle = hg; ctx.fill();
      ctx.strokeStyle = 'rgba(90,50,20,0.55)'; ctx.lineWidth = 1.3; ctx.stroke();
      // rubber grip
      ctx.beginPath(); rrect(-73, -7.5, 40, 15, 7);
      ctx.fillStyle = '#5e4b3d'; ctx.fill();
      ctx.strokeStyle = 'rgba(30,20,15,0.5)'; ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.13)'; ctx.lineWidth = 1.5;
      for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(-65 + k * 8, -6); ctx.lineTo(-65 + k * 8, 6); ctx.stroke(); }
      // steel head
      ctx.beginPath(); rrect(47, -30, 30, 60, 5);
      const sg = ctx.createLinearGradient(47, 0, 77, 0);
      sg.addColorStop(0, '#a3abb5'); sg.addColorStop(0.45, '#7d858f'); sg.addColorStop(1, '#5a616b');
      ctx.fillStyle = sg; ctx.fill();
      ctx.strokeStyle = 'rgba(30,34,40,0.6)'; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.fillStyle = '#bcc3cb';
      ctx.beginPath(); rrect(48.5, -29, 27, 6, 3); ctx.fill();
      ctx.fillStyle = 'rgba(40,44,50,0.35)';
      ctx.beginPath(); rrect(48.5, 23, 27, 6, 3); ctx.fill();
      ctx.fillStyle = '#4f565f';
      ctx.fillRect(44, -8.5, 4, 17);
      break;
    }
  }
  ctx.restore();
}

function drawInteraction(alpha) {
  if (!pointer.down) return;
  const px = pointer.x, py = pointer.y;
  if (pointer.mode === 'finger' && finger) {
    const p = bodyPose(finger, alpha), r = finger.parts[0].r;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU);
    ctx.fillStyle = 'rgba(95,78,55,0.12)'; ctx.fill();
    ctx.strokeStyle = 'rgba(95,78,55,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
    return;
  }
  let gx = 0, gy = 0;
  if (pointer.mode === 'pinch' || pointer.mode === 'whole') {
    let sw = 0;
    for (let k = 0; k < grab.n; k++) { const i = grab.idx[k], w = grab.wt[k]; gx += (RX[i] - grab.ox[k]) * w; gy += (RY[i] - grab.oy[k]) * w; sw += w; }
    gx /= sw; gy /= sw;
  } else if (pointer.mode === 'object' && grab.body) {
    const b = grab.body, p = bodyPose(b, alpha), c = Math.cos(p.a), s = Math.sin(p.a);
    gx = p.x + c * grab.lx - s * grab.ly; gy = p.y + s * grab.lx + c * grab.ly;
  } else return;
  ctx.strokeStyle = 'rgba(80,62,35,0.45)'; ctx.lineWidth = 1.3;
  if (Math.hypot(gx - px, gy - py) > 3) { ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(px, py); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(px, py, 4.5, 0, TAU);
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(gx, gy, 2.2, 0, TAU); ctx.fillStyle = 'rgba(80,62,35,0.5)'; ctx.fill();
}

let shakeX = 0, shakeY = 0, shakeT = 0;
function updateShake(dt) {
  shake *= Math.exp(-11 * dt);
  if (shake < 0.05) { shake = 0; shakeX = shakeY = 0; return; }
  shakeT += dt;
  shakeX = shake * Math.sin(shakeT * 83) * 0.8;
  shakeY = shake * Math.cos(shakeT * 71);
}

function render(alpha) {
  drawBackground();
  const k = world.scale * world.dpr;
  ctx.setTransform(k, 0, 0, k, shakeX * k, shakeY * k);
  drawFloor();
  for (const b of bodies) if (b.kind !== 'finger') drawObjectShadow(b, alpha);
  drawButter(alpha);
  for (const b of bodies) if (b.kind !== 'finger') drawObject(b, alpha);
  drawInteraction(alpha);
}

/* =========================================================================
   7. UI
   Panel controls, pointer wiring, keyboard shortcuts, FPS counter,
   resize handling and the fixed-timestep main loop.
   ========================================================================= */

const $ = id => document.getElementById(id);
const panel = $('panel'), hintEl = $('hint'), fpsEl = $('fps');

function hideHint() { hintEl.classList.add('gone'); }

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  world.dpr = dpr;
  world.scale = clamp(Math.min(cw / 620, ch / 720), 0.42, 2.2);
  world.w = cw / world.scale; world.h = ch / world.scale;
  world.floorY = world.h - clamp(world.h * 0.09, 40, 80);
  if (!butter.n) return;
  // keep everything inside the new bounds (shift whole bodies, no velocity spikes)
  butterBounds();
  let dx = 0, dy = 0;
  if (bb.maxX > world.w - 2) dx = world.w - 2 - bb.maxX;
  if (bb.minX + dx < 2) dx = 2 - bb.minX;
  if (bb.maxY > world.floorY) dy = world.floorY - bb.maxY;
  if (dx || dy) for (let i = 0; i < butter.n; i++) { BX[i] += dx; BPX[i] += dx; BSX[i] += dx; BY[i] += dy; BPY[i] += dy; BSY[i] += dy; }
  for (const b of bodies) {
    const nx = clamp(b.x, b.radius, Math.max(b.radius, world.w - b.radius)), ny = Math.min(b.y, world.floorY - b.radius);
    b.sx += nx - b.x; b.sy += ny - b.y; b.px += nx - b.x; b.py += ny - b.y; b.x = nx; b.y = ny;
  }
}

// ---- sliders ----
const sliderDefs = [
  ['softness', v => Math.round(v * 100) + '%'],
  ['elasticity', v => Math.round(v * 100) + '%'],
  ['damping', v => Math.round(v * 100) + '%'],
  ['gravity', v => Math.round(v)],
  ['mass', v => v.toFixed(1) + ' kg'],
];
for (const [key, fmt] of sliderDefs) {
  const input = $(key), out = $(key + 'Out');
  const sync = () => { params[key] = parseFloat(input.value); out.textContent = fmt(params[key]); };
  input.addEventListener('input', sync);
  sync();
}

// ---- buttons ----
function setGravity(on) {
  params.gravityOn = on;
  $('gravityBtn').classList.toggle('on', on);
}
$('gravityBtn').addEventListener('click', () => setGravity(!params.gravityOn));
$('resetBtn').addEventListener('click', resetAll);
$('clearObjects').addEventListener('click', clearObjects);

function toggleFullscreen() {
  const d = document, el = d.documentElement;
  if (!d.fullscreenElement && !d.webkitFullscreenElement) {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { const r = req.call(el); if (r && r.catch) r.catch(() => {}); }
  } else {
    const exit = d.exitFullscreen || d.webkitExitFullscreen;
    if (exit) exit.call(d);
  }
}
$('fullscreenBtn').addEventListener('click', toggleFullscreen);
const syncFsLabel = () => {
  $('fullscreenBtn').textContent = (document.fullscreenElement || document.webkitFullscreenElement) ? 'Exit fullscreen' : 'Fullscreen';
};
document.addEventListener('fullscreenchange', syncFsLabel);
document.addEventListener('webkitfullscreenchange', syncFsLabel);

function setPanelCollapsed(c) {
  panel.classList.toggle('collapsed', c);
  $('collapse').textContent = c ? '+' : '–';
}
$('collapse').addEventListener('click', () => setPanelCollapsed(!panel.classList.contains('collapsed')));

const grabSeg = $('grabSeg');
grabSeg.addEventListener('click', e => {
  const btn = e.target.closest('button[data-mode]');
  if (!btn) return;
  grabModeUI = btn.dataset.mode;
  for (const b of grabSeg.querySelectorAll('button')) b.classList.toggle('on', b === btn);
});

// Spawn buttons: click → drop from above; press and drag out → spawn in hand.
let pendingSpawn = null;
for (const btn of document.querySelectorAll('.spawn')) {
  btn.addEventListener('pointerdown', e => {
    if (pointer.down) return;
    pendingSpawn = { kind: btn.dataset.kind, x: e.clientX, y: e.clientY, id: e.pointerId, btn };
    hideHint();
  });
  btn.addEventListener('click', e => { if (e.detail === 0) dropObject(btn.dataset.kind); });   // keyboard activation
}

// ---- pointer on the canvas ----
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  if (pointer.down) return;
  if (e.pointerType === 'mouse' && e.button !== 0 && e.button !== 2) return;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
  const p = toWorld(e);
  pointer.down = true; pointer.id = e.pointerId; pointer.x = p.x; pointer.y = p.y;
  pointer.hist.length = 0; pushHistory(p.x, p.y);
  beginInteraction(p.x, p.y, e.button === 2 || e.shiftKey);
  updateCursor();
  hideHint();
  e.preventDefault();
});

window.addEventListener('pointermove', e => {
  if (pendingSpawn && e.pointerId === pendingSpawn.id && !pointer.down) {
    const dx = e.clientX - pendingSpawn.x, dy = e.clientY - pendingSpawn.y;
    const r = panel.getBoundingClientRect();
    const outside = e.clientX > r.right || e.clientY > r.bottom || e.clientX < r.left || e.clientY < r.top;
    if (Math.hypot(dx, dy) > 14 && outside) {       // dragged out of the panel: spawn it in the hand
      const p = toWorld(e);
      const b = spawnObject(pendingSpawn.kind, p.x, p.y);
      pendingSpawn = null;
      pointer.down = true; pointer.id = e.pointerId; pointer.x = p.x; pointer.y = p.y;
      pointer.hist.length = 0; pushHistory(p.x, p.y);
      pointer.simX = pointer.stepX0 = pointer.stepX1 = pointer.tx = p.x;
      pointer.simY = pointer.stepY0 = pointer.stepY1 = pointer.ty = p.y;
      beginObjectGrab(b, b.x, b.y);
      updateCursor();
    }
    return;
  }
  const p = toWorld(e);
  if (pointer.down && e.pointerId === pointer.id) {
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    if (evs && evs.length > 1) for (const ce of evs) { const q = toWorld(ce); pushHistory(q.x, q.y); }
    else pushHistory(p.x, p.y);
    pointer.x = p.x; pointer.y = p.y;
  } else if (!pointer.down) {
    pointer.x = p.x; pointer.y = p.y;
    updateCursor();
  }
});

function pointerUp(e) {
  if (pendingSpawn && e.pointerId === pendingSpawn.id) {
    const r = pendingSpawn.btn.getBoundingClientRect();
    if (e.type === 'pointerup' && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) dropObject(pendingSpawn.kind);
    pendingSpawn = null;
    return;
  }
  if (!pointer.down || e.pointerId !== pointer.id) return;
  const p = toWorld(e);
  if (e.type === 'pointerup') { pointer.x = p.x; pointer.y = p.y; }
  endInteraction();
  pointer.down = false; pointer.id = null;
  updateCursor();
}
window.addEventListener('pointerup', pointerUp);
window.addEventListener('pointercancel', pointerUp);
window.addEventListener('blur', () => {
  if (pointer.down) { endInteraction(); pointer.down = false; pointer.id = null; }
  pendingSpawn = null;
});

function updateCursor() {
  let c = 'default';
  if (pointer.down) c = pointer.mode === 'finger' ? 'none' : 'grabbing';
  else if (pickObject(pointer.x, pointer.y) || overButter(pointer.x, pointer.y)) c = 'grab';
  if (canvas.style.cursor !== c) canvas.style.cursor = c;
}

// ---- keyboard ----
window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  const k = e.key.toLowerCase();
  if (k === 'r') resetAll();
  else if (k === 'g') setGravity(!params.gravityOn);
  else if (k === 'f') toggleFullscreen();
  else if (k === 'h') setPanelCollapsed(!panel.classList.contains('collapsed'));
  else if (k >= '1' && k <= '5') dropObject(SPAWN_KEYS[+k - 1]);
  else return;
  hideHint();
});

// ---- main loop: fixed timestep + render interpolation ----
// Runs `steps` fixed steps, moving the pointer target smoothly from where the
// simulation last saw it to the latest pointer position.
function advance(steps) {
  const x0 = pointer.simX, y0 = pointer.simY;
  for (let k = 0; k < steps; k++) {
    pointer.stepX0 = pointer.simX; pointer.stepY0 = pointer.simY;
    pointer.stepX1 = lerp(x0, pointer.x, (k + 1) / steps);
    pointer.stepY1 = lerp(y0, pointer.y, (k + 1) / steps);
    step(STEP_DT);
    pointer.simX = pointer.stepX1; pointer.simY = pointer.stepY1;
  }
}

let lastTime = performance.now(), accumulator = 0, fpsFrames = 0, fpsTime = 0, paused = false;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.1) dt = 0.1;
  if (paused) dt = 0;
  accumulator += dt;
  let steps = Math.floor(accumulator / STEP_DT);
  if (steps > MAX_STEPS_PER_FRAME) { steps = MAX_STEPS_PER_FRAME; accumulator = 0; }
  else accumulator -= steps * STEP_DT;
  if (steps > 0) advance(steps);
  updateShake(dt);
  render(clamp(accumulator / STEP_DT, 0, 1));

  fpsFrames++; fpsTime += dt;
  if (fpsTime >= 0.5) { fpsEl.textContent = Math.round(fpsFrames / fpsTime) + ' FPS'; fpsFrames = 0; fpsTime = 0; }
}

// ---- boot ----
buildButterMesh();
resize();
deriveParams();
resetButter();
if (window.innerWidth < 700) setPanelCollapsed(true);
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { lastTime = performance.now(); });
requestAnimationFrame(t => { lastTime = t; frame(t); });

// small debugging / testing handle (deterministic stepping + scripted pointer)
window.butterToy = {
  params, world, butter, bodies, tune,
  pause(p = true) { paused = p; },
  run(steps = 1) { advance(steps); render(1); },
  press(x, y, whole = false) {
    pointer.down = true; pointer.id = -1; pointer.x = x; pointer.y = y;
    pointer.hist.length = 0; pushHistory(x, y); beginInteraction(x, y, whole !== (grabModeUI === 'whole'));
    return pointer.mode;
  },
  moveTo(x, y) { pointer.x = x; pointer.y = y; pushHistory(x, y); },
  release(vx = 0, vy = 0) {
    pointer.hist.length = 0;
    const t = performance.now();
    pointer.hist.push({ t: t - 50, x: pointer.x - vx * 0.05, y: pointer.y - vy * 0.05 }, { t, x: pointer.x, y: pointer.y });
    endInteraction(); pointer.down = false; pointer.id = null;
  },
  spawn: spawnObject, drop: dropObject, reset: resetAll,
  get shake() { return shake; },
  arrays: () => ({ BX, BY, BVX, BVY, stick: butter.stick }),
  state() {
    butterBounds();
    let A = 0;
    for (let i = 0; i < butter.nb; i++) { const j = (i + 1) % butter.nb; A += BX[i] * BY[j] - BX[j] * BY[i]; }
    return { n: butter.n, nb: butter.nb, nt: butter.nt, ne: butter.ne, cx: butter.cx, cy: butter.cy, angle: butter.angle,
             squash: butter.squash, areaRatio: 0.5 * A / butter.area0, minX: bb.minX + 4, maxX: bb.maxX - 4,
             minY: bb.minY + 4, maxY: bb.maxY - 4, floorY: world.floorY, w: world.w, h: world.h, scale: world.scale,
             objects: bodies.filter(b => b.kind !== 'finger').map(b => ({ kind: b.kind, x: b.x, y: b.y, vx: b.vx, vy: b.vy })) };
  },
};
})();
</script>
